name: Build Android APK (Debug)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build mobile version (Vite + Capacitor sync)
        working-directory: frontend
        run: npm run build:mobile

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK (Sideload flavor)
        working-directory: frontend/android
        run: ./gradlew assembleSideloadDebug --no-daemon --stacktrace

      - name: List APK files (for debug)
        working-directory: frontend/android
        run: find app/build/outputs -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openGym-fa-debug
          path: |
            frontend/android/app/build/outputs/apk/sideload/debug/*.apk
            frontend/android/app/build/outputs/apk/**/debug/*.apk
          retention-days: 14
          if-no-files-found: error
